name: Hosting Bot 24/7 - Ultra Stable

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *'  # الفحص والتشغيل كل 5 دقائق
  workflow_dispatch:
  repository_dispatch:
    types: [keep-alive]

concurrency:
  group: bot-running
  cancel-in-progress: false  # عدم إلغاء التشغيل الحالي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # للسماح بإعادة تشغيل الـ workflow

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # تسريع التثبيت

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir flask python-telegram-bot psutil requests aiohttp pyTelegramBotAPI telethon
          if [ -f requirements.txt ]; then 
            pip install --no-cache-dir -r requirements.txt
          fi

      - name: Check and Run Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: 8080
          PYTHONUNBUFFERED: 1  # لمنع تأخير السجلات
        run: |
          # الانتقال المباشر لمجلد العمل الأساسي وضمان قراءة الملفات من الصفحة الرئيسية
          cd ${{ github.workspace }}
          
          # طباعة الملفات الموجودة حالياً للتأكد في اللوج
          echo "📁 Files in current root directory:"
          ls -la
          
          # التحقق من تشغيل البوت مسبقاً لمنع التكرار
          if pgrep -f "python.*main.py" > /dev/null; then
            echo "🟢 Bot is already running in background."
          else
            if [ -f "main.py" ]; then
              echo "🚀 Starting main.py now at $(date)..."
              nohup python main.py > bot.log 2>&1 &
              sleep 3
              if pgrep -f "python.*main.py" > /dev/null; then
                echo "✅ Bot started successfully and running in background!"
              else
                echo "❌ Failed to start bot. Check bot.log output:"
                cat bot.log
                exit 1
              fi
            else
              echo "❌ Error: main.py is missing from root directory!"
              exit 1
            fi
          fi

      - name: Auto-Sync Data with Retry
        if: always()
        run: |
          cd ${{ github.workspace }}
          # محاولة المزامنة مع إعادة المحاولة
          for i in {1..5}; do
            echo "🔄 Sync attempt $i/5"
            
            git config --global user.name "GitHub Action"
            git config --global user.email "action@github.com"
            
            # تحديث الملفات
            mkdir -p hosted_projects
            
            # إضافة الملفات مع تجاهل المجلدات الفارغة
            git add hosted_projects/ || true
            
            # التحقق مما إذا كانت هناك تغييرات للقيام بـ commit
            if git diff-index --quiet HEAD --; then
              echo "ℹ️ No changes to commit"
              break
            else
              if git commit -m "Auto-sync $(date +'%Y-%m-%d %H:%M:%S')"; then
                echo "✅ Commit successful"
                if git push origin main; then
                  echo "✅ Push successful"
                  break
                else
                  echo "⚠️ Push failed, retrying..."
                  sleep 3
                  git pull --rebase origin main || true
                fi
              else
                echo "ℹ️ No changes or commit skipped"
                break
              fi
            fi
            
            sleep 2
          done

      - name: Cleanup
        if: always()
        run: |
          # تنظيف الملفات المؤقتة
          rm -rf /tmp/*.lock || true
          rm -rf /tmp/*.pid || true
          echo "🧹 Cleanup completed"

